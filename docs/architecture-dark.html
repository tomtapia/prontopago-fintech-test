<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risk inquiry, paved and guarded · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Secure paved road · Minimal dark</p>
    <h1>Risk inquiry, paved and guarded</h1>

    <svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc">
      <title id="architecture-dark-title">Risk inquiry, paved and guarded</title>
      <desc id="architecture-dark-desc">Browser SPA authenticates against an Express API; an RBAC gate admits own-RUT and admin score reads to a cached scoring service while foreign-RUT reads stop with 403.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Zones (painted first) -->
      <rect x="40" y="120" width="200" height="320" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <rect x="52" y="124" width="132" height="12" rx="2" fill="#2d3142"/>
      <text x="118" y="133" fill="rgba(245,245,245,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT · BROWSER</text>

      <rect x="280" y="120" width="640" height="320" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
      <rect x="292" y="124" width="84" height="12" rx="2" fill="#2d3142"/>
      <text x="334" y="133" fill="rgba(245,245,245,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">API · :3000</text>

      <!-- Arrows (before nodes) -->
      <!-- A1: SPA -> LOGIN, elbow right+up -->
      <path d="M 212,264 H 256 Q 264,264 264,256 V 200 Q 264,192 272,192 H 312"
            fill="none" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="184" y="222" width="72" height="12" rx="2" fill="#2d3142"/>
      <text x="220" y="231" fill="#6a95d8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /LOGIN</text>

      <!-- A2: LOGIN -> USERS, straight down -->
      <line x1="392" y1="224" x2="392" y2="312" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="400" y="262" width="48" height="12" rx="2" fill="#2d3142"/>
      <text x="424" y="271" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERIFY</text>

      <!-- A3: USERS -> SPA bottom, dashed return -->
      <path d="M 312,344 H 148 Q 140,344 140,336 V 304"
            fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="100" y="318" width="32" height="12" rx="2" fill="#2d3142"/>
      <text x="116" y="327" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JWT</text>

      <!-- A4: SPA right -> SCORE bottom, middle corridor -->
      <path d="M 212,292 H 532 Q 540,292 540,284 V 224"
            fill="none" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="262" y="272" width="76" height="12" rx="2" fill="#2d3142"/>
      <text x="300" y="281" fill="#6a95d8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET · BEARER</text>

      <!-- A5: SCORE -> GATE, straight down -->
      <line x1="584" y1="224" x2="584" y2="312" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="592" y="262" width="44" height="12" rx="2" fill="#2d3142"/>
      <text x="614" y="271" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECK</text>

      <!-- A6: GATE top -> SERVICE bottom, permitted (accent) -->
      <path d="M 624,312 V 276 H 816 Q 824,276 824,268 V 224"
            fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="698" y="256" width="44" height="12" rx="2" fill="#2d3142"/>
      <text x="720" y="265" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOW</text>

      <!-- A7: GATE bottom -> stop, forbidden (terminates at boundary) -->
      <line x1="544" y1="376" x2="544" y2="404" stroke="#bfc0c0" stroke-width="1.2"/>
      <circle cx="544" cy="412" r="8" fill="#2d3142" stroke="#bfc0c0" stroke-width="1.2"/>
      <line x1="539" y1="407" x2="549" y2="417" stroke="#bfc0c0" stroke-width="1.2"/>
      <rect x="556" y="384" width="64" height="12" rx="2" fill="#2d3142"/>
      <text x="588" y="393" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">403 · DENY</text>

      <!-- A8: SERVICE -> CACHE, READ -->
      <line x1="824" y1="224" x2="824" y2="312" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="776" y="238" width="40" height="12" rx="2" fill="#2d3142"/>
      <text x="796" y="247" fill="#8e98ac" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ</text>

      <!-- A9: CACHE -> SERVICE, dashed SCORE return -->
      <line x1="748" y1="312" x2="748" y2="224" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="756" y="292" width="44" height="12" rx="2" fill="#2d3142"/>
      <text x="778" y="301" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCORE</text>

      <!-- A10: CACHE bottom -> SPA bottom, dashed 200 return along open canvas -->
      <path d="M 786,376 V 448 H 104 Q 96,448 96,440 V 304"
            fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="409" y="428" width="72" height="12" rx="2" fill="#2d3142"/>
      <text x="445" y="437" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · SCORE</text>

      <!-- Nodes -->
      <!-- SPA -->
      <rect x="68" y="240" width="144" height="64" rx="6" fill="#2d3142"/>
      <rect x="68" y="240" width="144" height="64" rx="6" fill="rgba(191,192,192,0.10)" stroke="#8e98ac" stroke-width="1"/>
      <rect x="76" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(142,152,172,0.40)" stroke-width="0.8"/>
      <text x="90" y="257" fill="#8e98ac" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="140" y="280" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">React SPA</text>
      <text x="140" y="296" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:5173</text>

      <!-- LOGIN -->
      <rect x="312" y="160" width="160" height="64" rx="6" fill="#2d3142"/>
      <rect x="312" y="160" width="160" height="64" rx="6" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="320" y="168" width="24" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.30)" stroke-width="0.8"/>
      <text x="332" y="177" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="392" y="200" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Login route</text>
      <text x="392" y="216" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /login</text>

      <!-- USERS -->
      <rect x="312" y="312" width="160" height="64" rx="6" fill="#2d3142"/>
      <rect x="312" y="312" width="160" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
      <rect x="320" y="320" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.40)" stroke-width="0.8"/>
      <text x="336" y="329" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
      <text x="392" y="352" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mock users</text>
      <text x="392" y="368" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HS256 · 1h</text>

      <!-- SCORE -->
      <rect x="504" y="160" width="160" height="64" rx="6" fill="#2d3142"/>
      <rect x="504" y="160" width="160" height="64" rx="6" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="512" y="168" width="24" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.30)" stroke-width="0.8"/>
      <text x="524" y="177" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="584" y="200" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Score route</text>
      <text x="584" y="216" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GET /score/:rut</text>

      <!-- GATE -->
      <rect x="504" y="312" width="160" height="64" rx="6" fill="#2d3142"/>
      <rect x="504" y="312" width="160" height="64" rx="6" fill="rgba(240,138,89,0.05)" stroke="#f08a59" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="512" y="320" width="28" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
      <text x="526" y="329" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RBAC</text>
      <text x="584" y="352" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Auth gate</text>
      <text x="584" y="368" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">allow · deny</text>

      <!-- SERVICE (focal) -->
      <rect x="696" y="160" width="180" height="64" rx="6" fill="#2d3142"/>
      <rect x="696" y="160" width="180" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <rect x="704" y="168" width="24" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
      <text x="716" y="177" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="786" y="200" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Score service</text>
      <text x="786" y="216" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">validate → cache</text>

      <!-- CACHE -->
      <rect x="696" y="312" width="180" height="64" rx="6" fill="#2d3142"/>
      <rect x="696" y="312" width="180" height="64" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="1"/>
      <rect x="704" y="320" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,192,192,0.40)" stroke-width="0.8"/>
      <text x="722" y="329" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="786" y="352" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Score cache</text>
      <text x="786" y="368" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Map · sha256</text>

      <!-- Legend -->
      <line x1="40" y1="592" x2="920" y2="592" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <text x="40" y="608" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="620" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <text x="60" y="628" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Focal service</text>

      <rect x="176" y="620" width="14" height="10" rx="2" fill="rgba(240,138,89,0.05)" stroke="#f08a59" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="196" y="628" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">RBAC gate</text>

      <line x1="296" y1="624" x2="324" y2="624" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="332" y="628" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">HTTP call</text>

      <line x1="424" y1="624" x2="452" y2="624" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="460" y="628" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Return</text>

      <circle cx="556" cy="624" r="6" fill="#2d3142" stroke="#bfc0c0" stroke-width="1.2"/>
      <line x1="552" y1="620" x2="560" y2="628" stroke="#bfc0c0" stroke-width="1.2"/>
      <text x="570" y="628" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Blocked 403</text>

      <line x1="692" y1="624" x2="720" y2="624" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="728" y="628" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Permitted</text>
    </svg>
  </div>
</body>
</html>
