<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login once, score with one token · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 840px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Login once, score with one token</h1>

    <svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sequence-dark-title sequence-dark-desc">
      <title id="sequence-dark-title">Login once, score with one token</title>
      <desc id="sequence-dark-desc">SPA exchanges credentials for a JWT, then calls the score endpoint with it; an ALT fragment shows the own-RUT 200 path versus the foreign-RUT 403 denial.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#2d3142"/>

      <!-- Lifelines -->
      <line x1="160" y1="128" x2="160" y2="624" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="480" y1="128" x2="480" y2="624" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="624" stroke="rgba(245,245,245,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="476" y="176" width="8" height="48" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="0.8"/>
      <rect x="476" y="280" width="8" height="240" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="0.8"/>
      <rect x="796" y="384" width="8" height="40" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="0.8"/>

      <!-- M1: login call -->
      <line x1="160" y1="176" x2="476" y2="176" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="284" y="160" width="72" height="12" rx="2" fill="#2d3142"/>
      <text x="320" y="170" fill="#6a95d8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POST /LOGIN</text>

      <!-- M2: JWT return -->
      <line x1="476" y1="224" x2="168" y2="224" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="290" y="208" width="60" height="12" rx="2" fill="#2d3142"/>
      <text x="320" y="218" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · JWT</text>

      <!-- M3: score call -->
      <line x1="160" y1="280" x2="476" y2="280" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="284" y="264" width="72" height="12" rx="2" fill="#2d3142"/>
      <text x="320" y="274" fill="#6a95d8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GET · SCORE</text>

      <!-- ALT fragment -->
      <rect x="88" y="312" width="752" height="232" rx="4"
            fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
      <rect x="88" y="312" width="40" height="16" rx="2"
            fill="#2d3142" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
      <text x="108" y="324" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

      <text x="100" y="348" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[own rut · admin]</text>

      <!-- M4: check -->
      <line x1="484" y1="384" x2="796" y2="384" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="610" y="368" width="60" height="12" rx="2" fill="#2d3142"/>
      <text x="640" y="378" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK RUT</text>

      <!-- M5: headline 200 -->
      <line x1="796" y1="424" x2="488" y2="424" stroke="#f08a59" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="604" y="408" width="72" height="12" rx="2" fill="#2d3142"/>
      <text x="640" y="418" fill="#f08a59" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · SCORE</text>

      <line x1="96" y1="456" x2="832" y2="456"
            stroke="rgba(245,245,245,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

      <text x="100" y="480" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else · foreign rut]</text>

      <!-- M6: 403 denial -->
      <line x1="476" y1="512" x2="168" y2="512" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="288" y="496" width="64" height="12" rx="2" fill="#2d3142"/>
      <text x="320" y="506" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">403 · DENY</text>

      <!-- Actors -->
      <rect x="88" y="72" width="144" height="56" rx="6" fill="#2d3142"/>
      <rect x="88" y="72" width="144" height="56" rx="6" fill="rgba(191,192,192,0.10)" stroke="#8e98ac" stroke-width="1"/>
      <rect x="96" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(142,152,172,0.40)" stroke-width="0.8"/>
      <text x="110" y="89" fill="#8e98ac" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="160" y="104" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">React SPA</text>
      <text x="160" y="119" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:5173</text>

      <rect x="408" y="72" width="144" height="56" rx="6" fill="#2d3142"/>
      <rect x="408" y="72" width="144" height="56" rx="6" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="416" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.30)" stroke-width="0.8"/>
      <text x="428" y="89" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="480" y="104" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Express API</text>
      <text x="480" y="119" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">JWT · RBAC</text>

      <rect x="728" y="72" width="144" height="56" rx="6" fill="#2d3142"/>
      <rect x="728" y="72" width="144" height="56" rx="6" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
      <rect x="736" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.30)" stroke-width="0.8"/>
      <text x="748" y="89" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="800" y="104" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Score service</text>
      <text x="800" y="119" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cache · sha256</text>

      <!-- Legend -->
      <line x1="56" y1="648" x2="904" y2="648" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
      <text x="56" y="664" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="56" y="680" width="14" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
      <text x="76" y="688" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Headline 200</text>

      <rect x="200" y="676" width="28" height="18" rx="2" fill="rgba(245,245,245,0.04)" stroke="rgba(245,245,245,0.22)" stroke-width="1"/>
      <text x="208" y="688" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', monospace">ALT</text>
      <text x="236" y="688" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Fragment</text>

      <line x1="336" y1="684" x2="364" y2="684" stroke="#6a95d8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="372" y="688" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">HTTP call</text>

      <line x1="472" y1="684" x2="500" y2="684" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="508" y="688" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Return</text>

      <rect x="600" y="680" width="8" height="8" fill="rgba(245,245,245,0.06)" stroke="#bfc0c0" stroke-width="0.8"/>
      <text x="616" y="688" fill="#bfc0c0" font-size="8" font-family="'Geist', sans-serif">Activation</text>
    </svg>
  </div>
</body>
</html>
