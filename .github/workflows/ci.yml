name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @prontopago/api exec tsc --noEmit

      - name: Typecheck Web
        run: pnpm --filter @prontopago/web exec tsc --noEmit

      - name: Test API (coverage thresholds 80%)
        run: pnpm --filter @prontopago/api test

      - name: Test Web (coverage thresholds 80%)
        run: pnpm --filter @prontopago/web test

      - name: Build API
        run: pnpm --filter @prontopago/api build

      - name: Build Web
        run: pnpm --filter @prontopago/web build
